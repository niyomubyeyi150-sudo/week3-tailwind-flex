<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title> Tailwind Responsiveness</title>
</head>
<body>
  <nav class="flex items-center justify-between px-6 py-4 bg-white shadow-sm">
    <a href="#" class="text-xl font-bold text-indigo-600">Brand</a>
    <ul class=" hidden md:flex gap-6 text-slate-700">
        <li>
            <a href="#" class="hover:text-indigo-600">Home</a>
        </li>
        <li>
     <a href="#" class="hover:text-indigo-600">About</a>
        </li>
        <li>
        <a href="#" class="hover:text-indigo-600">Contact</a>
        </li>
    </ul>
    <button class="md:hidden" aria-label="Open menu">☰</button>
</nav>
<br>

<div class="flex items-start gap-4">
    <img 
        src="/image/gee.jpg" 
        alt="Jean Paul" 
        class="size-12 rounded-full shrink-0"
    >

    <div>
        <p class="font-semibold">Jean Paul</p>

        <p class="text-slate-600">
            Long comment text that can wrap onto many lines without squashing the avatar…
        </p>
    </div>
</div>
<br>

<form class="flex gap-2 max-w-lg">
    <input
        type="search"
        placeholder="Search…"
        class="grow border rounded-lg px-3 py-2"
    >

    <button
        type="submit"
        class="shrink-0 bg-slate-900 text-white px-4 rounded-lg"
    >
        Search
    </button>
</form>
<br>
<section class="grid grid-cols-3 gap-6">
    <article class="bg-blue-500 rounded-xl shadow p-4">
        Card 1
    </article>

    <article class="bg-green-400 rounded-xl shadow p-4">
        Card 2
    </article>

    <article class="bg-blue-700 rounded-xl shadow p-4">
        Card 3
    </article>
</section>
<br></br>
<div class="min-h-screen grid grid-rows-[auto_1fr_auto]">

    <header class="bg-slate-900 text-white p-4">
        Header
    </header>

    <div class="grid grid-cols-[220px_1fr]">

        <aside class="bg-slate-100 p-4">
            Sidebar
        </aside>

        <main class="p-6">
            Main content
        </main>

    </div>

    <footer class="bg-slate-900 text-slate-300 p-4 text-center">
        Footer
    </footer>

</div>
<br>
<!-- Flexbox: cards share space, last row items stretch -->
<div class="flex flex-wrap gap-4">

    <div class="flex-1 basis-60 bg-white rounded-xl shadow p-4">
        A
    </div>

    <div class="flex-1 basis-60 bg-white rounded-xl shadow p-4">
        B
    </div>

    <div class="flex-1 basis-60 bg-white rounded-xl shadow p-4">
        C
    </div>

</div>
<br>

<!-- Grid: cards align in strict columns -->
<div class="grid grid-cols-[repeat(auto-fill,minmax(15rem,1fr))] gap-4">

    <div class="bg-blue-800 rounded-xl shadow p-4">
        A
    </div>

    <div class="bg-blue-600 rounded-xl shadow p-4">
        B
    </div>

    <div class="bg-blue-400 rounded-xl shadow p-4">
        C
    </div>

</div>
</body>
</html>
